[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "octopus-live-engine"
version = "1.1.1"
description = "OCTOPUS Live Engine - Zero-Dependency In-Memory Synchronous Workflow Runtime & Visualizer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Katamba Martin" }]
keywords = ["workflow", "orchestration", "saga", "fastapi", "visualizer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0",
    # The Rust engine core, on the platforms it has wheels for (it has no
    # sdist). Elsewhere the SDK runs its own Python engine.
    "octopus-core==0.1.1; (sys_platform == 'darwin' and platform_machine in 'x86_64 arm64') or (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.urls]
Homepage = "https://github.com/martinkatamba/octopus_live_engine"
Source = "https://github.com/martinkatamba/octopus_live_engine"
Issues = "https://github.com/martinkatamba/octopus_live_engine/issues"

[project.optional-dependencies]
# Kept so `pip install "octopus-live-engine[core]"` still works; the core is
# now a dependency (above). On a platform without a wheel this asks pip for
# the core anyway, and the install fails instead of falling back.
core = [
    "octopus-core==0.1.1"
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/octopus_live"]
