[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octopus-live-engine"
version = "1.0.0"
description = "OCTOPUS Live Engine - Zero-Dependency In-Memory Synchronous Workflow Runtime & Visualizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "sse-starlette>=2.0.0"
]

[project.optional-dependencies]
# The Rust engine core: OctopusLiveEngine(engine="core") or OCTOPUS_LIVE_ENGINE=core.
core = [
    "octopus-core==0.1.0"
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/octopus_live"]
