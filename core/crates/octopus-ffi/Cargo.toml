[package]
name = "octopus-live-ffi"
description = "C ABI over octopus-core, loaded by the Python, .NET, Java and Go SDKs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "octopus_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# The core's default stores are always in. Temporal is off by default, so the
# debug build and tests need no protoc; CI's release libraries turn it on, as
# the Python wheel does (decision D13). DuckDB builds C++ for a long time.
temporal = ["octopus-core/temporal"]
duckdb = ["octopus-core/duckdb"]

[dependencies]
octopus-core = { package = "octopus-live-core", path = "../octopus-core", version = "0.1.0" }
