# Generates include/octopus.h. Regenerate after changing an export:
#   cbindgen --config cbindgen.toml --output include/octopus.h
# CI checks it is current with --verify (see ../../scripts/check-header.sh).
language = "C"
include_guard = "OCTOPUS_H"
autogen_warning = "/* Generated by cbindgen from crates/octopus-ffi. Do not edit. */"
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["OctopusEngine", "OctopusOut"]

[parse]
parse_deps = false

[macro_expansion]
bitflags = false
