# Wheels: `maturin build --release`. They use the stable ABI (abi3), so one
# wheel per platform serves Python 3.10 and later. For development,
# ./build.sh builds for one interpreter, without abi3.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "octopus-core"
description = "The OCTOPUS Live Engine core for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Katamba Martin" }]
keywords = ["workflow", "orchestration", "saga", "engine", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/martinkatamba/octopus_live_engine"
Source = "https://github.com/martinkatamba/octopus_live_engine"
Issues = "https://github.com/martinkatamba/octopus_live_engine/issues"

[tool.maturin]
python-source = "python"
module-name = "octopus_core._native"
features = ["pyo3/abi3-py310"]
exclude = ["**/__pycache__/**"]
