[package]
name = "octopus_live_engine"
version = "1.0.0"
edition = "2021"
description = "OCTOPUS Live Engine (Rust) - Ultra-Low Latency In-Memory Workflow Execution Engine with Interactive AntV X6 Visualizer and Hexagonal Architecture"
license = "MIT"
authors = ["Katamba Martin"]
repository = "https://github.com/martinkatamba/octopus_live_engine"
readme = "README.md"

[lib]
name = "octopus_live_engine"
path = "src/lib.rs"

# The engine logic, stores and drivers live in octopus-core. These features
# switch the core's drivers on: the defaults give real Redis and SQL stores,
# `--no-default-features` builds the memory-only engine, and `temporal` is
# opt-in because building the Temporal SDK needs `protoc`
# (brew install protobuf / apt install protobuf-compiler).
[features]
default = ["redis", "postgres", "mysql", "sqlite", "mssql"]
redis = ["octopus-core/redis"]
postgres = ["octopus-core/postgres"]
mysql = ["octopus-core/mysql"]
sqlite = ["octopus-core/sqlite"]
mssql = ["octopus-core/mssql"]
temporal = ["octopus-core/temporal"]

[dependencies]
octopus-core = { path = "../core/crates/octopus-core", version = "0.1.0", default-features = false }
