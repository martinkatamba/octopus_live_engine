# Builds the octopus-core wheels (core/bindings/python) for every platform the
# Python SDK supports, then installs each one and runs the SDK's tests on it.
# It also builds the SDK, octopus-live-engine. Run by hand with `publish` set,
# it then uploads both to PyPI (trusted publishing: each PyPI project must list
# this workflow and the `pypi` environment).
name: python-wheels

on:
  push:
    paths: ["core/**", "python/**", ".github/workflows/python-wheels.yml"]
  pull_request:
    paths: ["core/**", "python/**", ".github/workflows/python-wheels.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the wheels to PyPI after the tests pass"
        type: boolean
        default: false

jobs:
  licenses:
    # The wheels ship THIRD_PARTY_LICENSES.txt; it must list the crates they link.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Third-party licence notices are up to date
        run: python3 core/scripts/third_party_licenses.py --check

  build:
    name: ${{ matrix.target }} (${{ matrix.os }}, ${{ matrix.manylinux || 'native' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }  # macos-13 is retired
          - { os: macos-15, target: aarch64 }  # macos-14 jobs are refused ("not supported")
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Temporal SDK's build needs a recent protoc (proto3 `optional`),
      # newer than the distributions' packages.
      - name: protoc (macOS, Windows)
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: core/bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          # Runs in the build container, an x86_64 host for every target.
          before-script-linux: |
            set -e
            curl -sSfL -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            (unzip -o -q /tmp/protoc.zip -d /usr/local || python3 -m zipfile -e /tmp/protoc.zip /usr/local)
            chmod +x /usr/local/bin/protoc
            protoc --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: core/bindings/python/dist/*.whl

  sdk:
    # The SDK, octopus-live-engine: pure Python, one wheel and an sdist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the SDK
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: python/dist/*

  test:
    # The wheels this runner can load: install one, then run the SDK on the core.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheel-ubuntu-latest-x86_64-2_28 }
          - { os: macos-15, artifact: wheel-macos-15-aarch64-native }
          - { os: windows-latest, artifact: wheel-windows-latest-x64-native }
        python: ["3.11", "3.12"]  # the SDK needs 3.11+; the wheel itself loads on 3.10+
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the SDK with the core wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install -e "python[dev]"
      - name: SDK tests on the core (the default) and on the Python engine
        shell: bash
        working-directory: python
        run: |
          python -c "import octopus_live, octopus_core; print('octopus_core', octopus_core.CORE_VERSION)"
          python -m pytest tests -q
          OCTOPUS_LIVE_ENGINE=python python -m pytest tests -q

  publish:
    # Only when run by hand with `publish`, and only if every test passed.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [licenses, sdk, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
