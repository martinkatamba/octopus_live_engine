# Builds the octopus-core wheels (core/bindings/python) for every platform the
# Python SDK supports, then installs each one and runs the SDK's tests on it.
# It also builds the SDK, octopus-live-engine. Run by hand with `publish` set,
# it then uploads both to PyPI by trusted publishing: PyPI lists this workflow
# for octopus-core with the `pypi` environment, and for octopus-live-engine
# with `pypi-sdk`. The example apps' tests and browser suites run too, on both
# engines, with this run's core wheel.
name: python-wheels

on:
  push:
    paths: ["core/**", "python/**", "examples/python/**", ".github/workflows/python-wheels.yml"]
  pull_request:
    paths: ["core/**", "python/**", "examples/python/**", ".github/workflows/python-wheels.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the wheels to PyPI after the tests pass"
        type: boolean
        default: false

jobs:
  licenses:
    # The wheels ship THIRD_PARTY_LICENSES.txt; it must list the crates they link.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Third-party licence notices are up to date
        run: python3 core/scripts/third_party_licenses.py --check

  build:
    name: ${{ matrix.target }} (${{ matrix.os }}, ${{ matrix.manylinux || 'native' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }  # macos-13 is retired
          - { os: macos-15, target: aarch64 }  # macos-14 jobs are refused ("not supported")
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Temporal SDK's build needs a recent protoc (proto3 `optional`),
      # newer than the distributions' packages.
      - name: protoc (macOS, Windows)
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: core/bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
          # Runs in the build container, an x86_64 host for every target.
          before-script-linux: |
            set -e
            curl -sSfL -o /tmp/protoc.zip \
              https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            (unzip -o -q /tmp/protoc.zip -d /usr/local || python3 -m zipfile -e /tmp/protoc.zip /usr/local)
            chmod +x /usr/local/bin/protoc
            protoc --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: core/bindings/python/dist/*.whl

  sdk:
    # The SDK, octopus-live-engine: pure Python, one wheel and an sdist.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the SDK
        working-directory: python
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk
          path: python/dist/*

  test:
    # The wheels this runner can load: install one, then run the SDK on the core.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: wheel-ubuntu-latest-x86_64-2_28 }
          - { os: macos-15, artifact: wheel-macos-15-aarch64-native }
          - { os: windows-latest, artifact: wheel-windows-latest-x64-native }
        python: ["3.11", "3.12"]  # the SDK needs 3.11+; the wheel itself loads on 3.10+
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the SDK with the core wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # One command: if the SDK's octopus-core pin doesn't match this
          # wheel, pip fails instead of swapping in the wheel from PyPI.
          python -m pip install dist/*.whl -e "python[dev]"
      - name: SDK tests on the core (the default) and on the Python engine
        shell: bash
        working-directory: python
        run: |
          python -c "import octopus_live, octopus_core; print('octopus_core', octopus_core.CORE_VERSION)"
          python -m pytest tests -q
          OCTOPUS_LIVE_ENGINE=python python -m pytest tests -q

  examples:
    # The example apps on this run's core wheel: their tests, then their
    # browser suites (headless Chrome, which the runner image has), on the core
    # and on the Python engine.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-x86_64-2_28
          path: dist
      - name: Install the SDK, the core wheel and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl -e "python[dev]" requests \
            robotframework robotframework-seleniumlibrary robotframework-requests
      - name: Example tests
        run: |
          failed=0
          for engine in core python; do
            # One file at a time: each example has its own `server` module.
            for t in examples/python/*/test_*.py; do
              echo "::group::$engine: $t"
              OCTOPUS_LIVE_ENGINE=$engine python -m pytest "$t" -q -p no:cacheprovider || failed=1
              echo "::endgroup::"
            done
          done
          exit $failed
      - name: Browser suites
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for engine in core python; do
            for s in examples/python/*/*.robot; do
              name=$(basename "$(dirname "$s")")
              OCTOPUS_LIVE_ENGINE=$engine robot --outputdir "robot-results/$engine/$name" \
                --variable PYTHON:"$(command -v python)" \
                --variable SCREENSHOTS_DIR:"$PWD/robot-results/$engine/$name/screens" "$s" || failed=1
            done
          done
          exit $failed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: robot-results
          path: robot-results

  publish:
    # Only when run by hand with `publish`, and only if every test passed.
    # octopus-core's wheels; PyPI's publisher for octopus-core names `pypi`.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [licenses, test, examples]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - name: Is this version new on PyPI?
        # An SDK-only release reuses the core's version, so this only warns;
        # the SDK's own check (below) fails.
        run: |
          python3 - octopus-core warning <<'EOF'
          import json, os, sys, urllib.request
          package, already = sys.argv[1], sys.argv[2]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as r:
                  on_pypi = {f["filename"] for files in json.load(r)["releases"].values() for f in files}
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
              on_pypi = set()
          new = sorted(set(os.listdir("dist")) - on_pypi)
          print("New on PyPI:", ", ".join(new) or "nothing")
          if not new:
              print(f"::{already}::Every {package} file built from {os.environ['GITHUB_SHA'][:7]} is already on PyPI, so nothing will be uploaded. Bump the version, or check that the run is on the commit you meant.")
              sys.exit(1 if already == "error" else 0)
          EOF
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true  # a rerun after a partial upload

  publish-sdk:
    # The SDK, octopus-live-engine. Its own environment, because PyPI refuses
    # two publishers with the same repository, workflow and environment.
    # After `publish`: the SDK pins octopus-core exactly, so it goes up only
    # once that version is on PyPI.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [sdk, test, examples, publish]
    runs-on: ubuntu-latest
    environment: pypi-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk
          path: dist
      - run: ls -l dist
      - name: Is this version new on PyPI?
        # Fails instead of skipping: a version can't be replaced on PyPI, so
        # a run with nothing new for the SDK is a mistake (an old commit, or
        # a forgotten version bump), not a success. On 2026-11-27, 1.1.0 was
        # published from the commit before the release PR, pinned to the
        # old core; run the release from the merge commit.
        run: |
          python3 - octopus-live-engine error <<'EOF'
          import json, os, sys, urllib.request
          package, already = sys.argv[1], sys.argv[2]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as r:
                  on_pypi = {f["filename"] for files in json.load(r)["releases"].values() for f in files}
          except urllib.error.HTTPError as e:
              if e.code != 404: raise
              on_pypi = set()
          new = sorted(set(os.listdir("dist")) - on_pypi)
          print("New on PyPI:", ", ".join(new) or "nothing")
          if not new:
              print(f"::{already}::Every {package} file built from {os.environ['GITHUB_SHA'][:7]} is already on PyPI, so nothing will be uploaded. Bump the version, or check that the run is on the commit you meant.")
              sys.exit(1 if already == "error" else 0)
          EOF
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
