# The conformance suite (core/conformance): every case on the Go, Rust,
# Python and .NET live engines, on the .NET SDK over the core, and on
# octopus-core, checked against the documented behaviour. Fails on any case
# an engine gets wrong, except on the .NET engine, which is reported only.
name: conformance

on:
  push:
    paths: ["core/**", "python/**", "go/**", "rust/**", "dotnet/**", ".github/workflows/conformance.yml"]
  pull_request:
    paths: ["core/**", "python/**", "go/**", "rust/**", "dotnet/**", ".github/workflows/conformance.yml"]
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/conformance/runners/go/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: The Python engine's dependencies
        # The runner imports the SDK from python/src and runs its own engine,
        # so octopus-core is left out: the SDK may pin a version that isn't
        # on PyPI yet (it is published after this passes). The core is
        # checked by its own runner, built from this checkout.
        run: |
          python - > sdk-deps.txt <<'EOF'
          import tomllib
          deps = tomllib.load(open("python/pyproject.toml", "rb"))["project"]["dependencies"]
          print("\n".join(d for d in deps if not d.startswith("octopus-core")))
          EOF
          python -m pip install -r sdk-deps.txt
          python -m pip install --no-deps -e python
      - name: Run every case on every engine
        env:
          PYTHON: python
        run: core/conformance/run.sh --strict
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: conformance-results
          path: core/conformance/results
