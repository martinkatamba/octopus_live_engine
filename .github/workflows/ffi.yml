# The C ABI (core/crates/octopus-ffi) that the .NET, Java and Go SDKs load.
# `check` verifies that include/octopus.h matches the exports, that a C
# program runs against the library and that the library's licence notices are
# up to date. `build` makes the release library for each platform those SDKs
# ship, one artifact per .NET runtime identifier (runtimes/<rid>/native, as a
# NuGet package lays them out), and runs the C program against it.
#
# Then the .NET SDK's NuGet package, OctopusLiveWire, with those libraries:
# `nuget` packs it, and `nuget-check` installs it on each of those platforms
# and runs the README's example on the core. Run by hand with `publish`, it
# then goes to nuget.org by trusted publishing: nuget.org has a policy for
# this repository and workflow, the `nuget` environment, and the NUGET_USER
# secret names the nuget.org account.
name: ffi

on:
  push:
    paths: ["core/**", "dotnet/Octopus.LiveEngine/**", "dotnet/PackageCheck/**", ".github/workflows/ffi.yml"]
  pull_request:
    paths: ["core/**", "dotnet/Octopus.LiveEngine/**", "dotnet/PackageCheck/**", ".github/workflows/ffi.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the NuGet package to nuget.org after the checks pass"
        type: boolean
        default: false

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        if: runner.os != 'Windows'
        with:
          # The version that wrote include/octopus.h: --verify compares text.
          tool: cbindgen@0.29.4
      - name: Header, build and C smoke test
        # smoke.c uses memmem, which MSVC lacks; Windows runs the Rust tests.
        if: runner.os != 'Windows'
        run: core/scripts/check-ffi.sh
      - name: Tests
        working-directory: core
        run: cargo test -p octopus-live-ffi
      - name: Third-party licence notices are up to date
        # The NuGet package ships them with the library.
        if: runner.os == 'Linux'
        run: >-
          python3 core/scripts/third_party_licenses.py --check
          --manifest core/crates/octopus-ffi/Cargo.toml --features temporal
          --out core/crates/octopus-ffi/THIRD_PARTY_LICENSES.txt

  build:
    # Every store and Temporal, as in the Python wheel (decision D13).
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    env:
      # Without their symbol tables the libraries are about a third smaller;
      # the package carries five of them.
      CARGO_PROFILE_RELEASE_STRIP: symbols
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28, in the manylinux image the Python wheels use.
          - { rid: linux-x64, os: ubuntu-latest, image: "quay.io/pypa/manylinux_2_28_x86_64", protoc: linux-x86_64, lib: liboctopus_ffi.so }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, image: "quay.io/pypa/manylinux_2_28_aarch64", protoc: linux-aarch_64, lib: liboctopus_ffi.so }
          - { rid: osx-x64, os: macos-15-intel, lib: liboctopus_ffi.dylib }
          - { rid: osx-arm64, os: macos-15, lib: liboctopus_ffi.dylib }
          - { rid: win-x64, os: windows-latest, lib: octopus_ffi.dll }
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, in the manylinux container)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src/core -e PROTOC_PLAT=${{ matrix.protoc }} -e CARGO_PROFILE_RELEASE_STRIP ${{ matrix.image }} bash -euxc '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            # The Temporal SDK needs a newer protoc than the distribution has.
            curl -sSfL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-$PROTOC_PLAT.zip"
            (unzip -o -q /tmp/protoc.zip -d /usr/local || python3 -m zipfile -e /tmp/protoc.zip /usr/local)
            chmod +x /usr/local/bin/protoc
            cargo build --release -p octopus-live-ffi --features temporal
          '
      - name: protoc (macOS, Windows)
        if: runner.os != 'Linux'
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: core
        run: cargo build --release -p octopus-live-ffi --features temporal
      - name: C smoke test against the release library
        if: runner.os != 'Windows'
        run: |
          OUT=core/target/release
          cc -std=c99 -D_GNU_SOURCE -Wall -Werror -I core/crates/octopus-ffi/include \
            core/crates/octopus-ffi/tests/c/smoke.c -L "$OUT" -loctopus_ffi -o smoke
          DYLD_LIBRARY_PATH="$OUT" LD_LIBRARY_PATH="$OUT" ./smoke
      - name: Package
        shell: bash
        run: |
          mkdir -p "dist/runtimes/${{ matrix.rid }}/native" dist/include
          cp "core/target/release/${{ matrix.lib }}" "dist/runtimes/${{ matrix.rid }}/native/"
          cp core/crates/octopus-ffi/include/octopus.h dist/include/
          cp LICENSE core/crates/octopus-ffi/THIRD_PARTY_LICENSES.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: octopus-ffi-${{ matrix.rid }}
          path: dist/

  nuget:
    # The package, with every platform's library (the pack fails without one).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          pattern: octopus-ffi-*
          merge-multiple: true
          path: native
      - name: Pack
        run: >-
          dotnet pack dotnet/Octopus.LiveEngine -c Release -o nupkg
          -p:OctopusNativeDir="$PWD/native" -p:OctopusRequireNative=true
      - name: Contents
        run: unzip -l nupkg/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nupkg/

  nuget-check:
    # The package as a user gets it, on each platform it carries the core for:
    # a plain build (runtimes/ beside the app) and a publish for that platform.
    name: nuget-check (${{ matrix.rid }})
    needs: nuget
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
          - { rid: win-x64, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nupkg
      - name: Package version
        run: |
          f=$(ls nupkg/OctopusLiveWire.*.nupkg)
          v=${f#nupkg/OctopusLiveWire.}; v=${v%.nupkg}
          echo "PKG_ARGS=-p:OctopusLiveWireVersion=$v -p:RestoreAdditionalProjectSources=$PWD/nupkg" >> "$GITHUB_ENV"
      - name: The README's example, from the package
        run: dotnet run --project dotnet/PackageCheck $PKG_ARGS
      - name: The same, published for ${{ matrix.rid }}
        run: |
          dotnet publish dotnet/PackageCheck -r ${{ matrix.rid }} --self-contained false -o published $PKG_ARGS
          dotnet published/PackageCheck.dll

  nuget-publish:
    # Only when run by hand with `publish`, and only if every check passed.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [check, nuget-check]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # trusted publishing; no API key is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nupkg
      - name: Is this version new on nuget.org?
        # A version can't be replaced on nuget.org, so a run with nothing new
        # is a mistake (an old commit, or a forgotten version bump).
        run: |
          f=$(ls nupkg/OctopusLiveWire.*.nupkg)
          v=${f#nupkg/OctopusLiveWire.}; v=${v%.nupkg}
          code=$(curl -s -o versions.json -w '%{http_code}' https://api.nuget.org/v3-flatcontainer/octopuslivewire/index.json)
          if [ "$code" = 200 ] && python3 -c "import json,sys; sys.exit(0 if sys.argv[1].lower() in json.load(open('versions.json'))['versions'] else 1)" "$v"; then
            echo "::error::OctopusLiveWire $v is already on nuget.org"; exit 1
          fi
          echo "OctopusLiveWire $v is new on nuget.org"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: nuget.org login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >-
          dotnet nuget push nupkg/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
